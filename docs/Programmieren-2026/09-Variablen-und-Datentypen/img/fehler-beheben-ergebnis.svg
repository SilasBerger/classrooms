<metadata><raw>from turtle import *

penup()
back(100)
pendown()

abstand = 50  # Diese Zeile hat gefehlt, die Variable abstand war nicht definiert.

pencolor('red')
for i in range(5):
    forward(30)
    left(72)

penup()
forward(abstand)
pendown()

pencolor('blue')
for i in range(4):
    forward(35)
    left(90)

penup()
forward(abstand)
pendown()

pencolor('brown')
for i in range(6):
    forward(20)
    left(60)</raw></metadata></svg>